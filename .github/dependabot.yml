# Security updates only.
# open-pull-requests-limit: 0 turns off routine version bumps.
# Security updates still open, grouped into one PR per ecosystem and folder.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      pip-security-root:
        applies-to: security-updates
        patterns: ["*"]
